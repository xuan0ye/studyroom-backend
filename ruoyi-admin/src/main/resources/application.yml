--- # 米家IoT设备配置
miot:
  # Home Assistant REST API (推荐: 本地网络部署)
  home-assistant:
    url: http://localhost:8123  # Home Assistant 地址
    token:   # Long-Lived Access Token (在HA用户资料页面生成)
  # MQTT Broker (用于直接MQTT通信)
  mqtt:
    broker: tcp://localhost:1883  # MQTT Broker地址
    client-id: study-room-server  # 客户端ID
    username:   # MQTT用户名
    password:   # MQTT密码
  # 小米IoT平台API (需注册开发者: https://iot.mi.com)
  api:
    base-url: https://open.home.mi.com
    app-id: ${MIOT_APP_ID:}   # 小米开放平台 appId
    app-secret: ${MIOT_APP_SECRET:}   # 小米开放平台 appSecret
    access-token: ${MIOT_ACCESS_TOKEN:}   # 初始 access token
    refresh-token: ${MIOT_REFRESH_TOKEN:}   # refresh token
    # 兼容旧配置（后续可移除）
    url: https://api.home.mi.com
    app-key:

studyroom:
  # 排行榜规则
  rank:
    # 今日早到榜的起算小时(默认 6 点): 页面文案承诺"今日 6 点后谁先到谁先开灯",
    # 而原实现只按日期过滤, 导致凌晨 1:20 开灯的人拿了早到榜第一。改这里即可调整门槛。
    early-start-hour: ${STUDYROOM_RANK_EARLY_HOUR:6}
  # 米家灵动开关桥接(座位灯控制)
  miot:
    # 桥接脚本路径(服务器部署时改为服务器上的路径, 如 /opt/studyroom/tools/miot_bridge.py)
    bridge-script: ${STUDYROOM_MIOT_SCRIPT:G:/1自习室小程序/tools/miot_bridge.py}
    # Python 可执行文件(服务器可用绝对路径, 如 /usr/bin/python3)
    python: ${STUDYROOM_MIOT_PYTHON:python}
  device:
    compensation:
      cron: 0 */1 * * * ?
      max-retry-attempts: 5
      backoff-minutes: 1,3,10
    alert:
      webhook-url:
  access:
    mqtt:
      # broker 内部地址(本机 mosquitto)
      host: tcp://127.0.0.1:1883
      # 下发给设备的公网地址与端口: 设备据此连接, 必须是设备能访问到的地址
      public-host: ${STUDYROOM_MQTT_PUBLIC_HOST:101.133.152.241}
      public-port: ${STUDYROOM_MQTT_PUBLIC_PORT:1883}
      username: ${STUDYROOM_MQTT_USERNAME:studyroom}
      password: ${STUDYROOM_MQTT_PASSWORD:4McFjMfBMCtUoPNzgPpILfcA}
      pub-topic: face-device/sub
      sub-topic: face-device/pub
    # 设备引导(GET/POST /server/access/): 厂商协议里设备靠它拿 MQTT 配置
    bootstrap:
      enabled: true
      # 下发给设备的 HTTP API 根地址(指向我们, 设备对它的调用会被探针抓下来)
      http-svr: https://api.dayousuoan.top/access/v1/
      default-access-type: "0A05"
      # 录脸二维码仍指向厂商(人脸数据还在其云上)
      qr-url-template: https://access.yefiot.com/act?c=%s
      # 《云端MQTT协议精简版 v1.12》的 /login 应答里下发的"记录上传基址":
      # 设备会往 <这里>/upRecord、/upStrangerRecord、/upCapturet 发 HTTP POST。
      # 用 http 而非 https: 文档示例是 http, 且避免设备不做 TLS。
      record-url: ${STUDYROOM_ACCESS_RECORD_URL:http://api.dayousuoan.top/access/v1}
      keepalive: 90
    redis:
      command-channel: studyroom:access:command
    bridge:
      enabled: false
      client-id-prefix: studyroom-access-bridge-
      reconnect-delay-ms: 15000
      # 若需要走HTTP回调填本项，例如: http://127.0.0.1:8081/api/faceDevice/report
      upstream-callback-url:
    alert:
      webhook-url:
      temperature-threshold: 37.3
    revoke:
      cron: 0 */2 * * * ?
      max-retry-attempts: 5
      backoff-minutes: 1,3,10
    probe:
      enabled: true
      response: '{"code":0,"msg":"success"}'
  ai:
    enabled: true
    base-url: https://open.bigmodel.cn/api/paas/v4
    api-key: "39087af2bc6c4d559b1ba80856555137.sK8KOdDFsiFGuU3p"
    chat-model: glm-4-flash
    embedding-model: embedding-2
    temperature: 0.7
    max-tokens: 1024
    timeout-sec: 60
    history-turns: 3
    kb-enabled: true
    kb-top-k: 4
