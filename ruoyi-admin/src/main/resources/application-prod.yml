--- # 生产环境开关
studyroom:
  dev:
    # 生产必须关闭 mock 登录!
    mock-login: false
  # 米家桥接脚本(生产部署路径, 可用环境变量 STUDYROOM_MIOT_SCRIPT / STUDYROOM_MIOT_PYTHON 覆盖)
  miot:
    bridge-script: ${STUDYROOM_MIOT_SCRIPT:/deploy/miot_bridge.py}
    python: ${STUDYROOM_MIOT_PYTHON:/usr/bin/python3}
  ai:
    # msgSecCheck 内容安全(微信审核 AIGC 合规要求), 生产保持开启
    content-security:
      enabled: true
